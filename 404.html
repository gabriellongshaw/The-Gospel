<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gospel | Page Not Found</title>
  <meta name="robots" content="noindex">
  <meta name="author" content="Gabriel Longshaw">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0c08" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/logo/favicon/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
  <style>
:root{--bg:#faf8f5;--text:#1a1208;--muted:rgba(26,18,8,0.55);--border:#e0d9ce;--surface:#ffffff;--accent:#b8862a;--verse:#7a4a1e;--btn:#2c1a0e;--btn-text:#faf8f5;--btn-hover:#4a2f18;--btn2:#f0ede8;--btn2-text:#2c1a0e;--btn2-border:#e0d9ce;--btn2-hover:#e6e1d9}
@media (prefers-color-scheme:dark){:root{--bg:#0f0c08;--text:#e8dcc8;--muted:rgba(232,220,200,0.5);--border:#2e2618;--surface:#1c1710;--accent:#d4a44e;--verse:#d4a44e;--btn:#d4a44e;--btn-text:#0f0c08;--btn-hover:#c4943e;--btn2:#221c12;--btn2-text:#e8dcc8;--btn2-border:#2e2618;--btn2-hover:#2a2216}}
:root{--font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--display:'Lora',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1.25rem;
  font-family:var(--font);
  line-height:1.6
}
main{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:32rem}
h1{font-family:var(--display);font-size:2.25rem;line-height:1.15}
.meta{margin:0.9rem 0 1.1rem;font-size:0.75rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase}
.desc{margin-bottom:2rem;line-height:1.7}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:0.75rem;margin-bottom:2rem}
.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:0.8rem 1.5rem;
  border:1px solid transparent;
  border-radius:100px;
  background:var(--btn);
  color:var(--btn-text);
  font-size:0.9rem;
  font-weight:600;
  letter-spacing:0.02em;
  text-decoration:none;
  white-space:nowrap;
  transition:background 0.2s ease,border-color 0.2s ease
}
.button:hover{background:var(--btn-hover)}
.button:active{transform:scale(0.97)}
.button.secondary{background:var(--btn2);border-color:var(--btn2-border);color:var(--btn2-text)}
.button.secondary:hover{background:var(--btn2-hover)}
.note{
  max-width:100%;
  padding:0.85rem 1.1rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:0.8rem;
  line-height:1.6;
  overflow-wrap:anywhere
}
.note span{color:var(--text)}
@media (min-width:600px){
  h1{font-size:2.75rem}
}
h1{font-weight:600;letter-spacing:-0.01em}
.mark{margin-bottom:1.75rem;color:var(--accent)}
.meta{color:var(--accent)}
.desc{max-width:26rem;margin-bottom:1.75rem;color:var(--muted)}
.verse{
  max-width:26rem;
  margin-bottom:2rem;
  padding-left:1.1rem;
  border-left:2px solid var(--accent);
  text-align:left
}
.verse p{font-family:var(--display);font-size:1.15rem;font-style:italic;line-height:1.6;color:var(--text)}
.verse cite{display:block;margin-top:0.35rem;color:var(--verse);font-size:0.8rem;font-style:normal;font-weight:500;letter-spacing:0.04em}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><svg width="34" height="44" viewBox="0 0 34 44" fill="none" aria-hidden="true"><rect x="14" y="0" width="6" height="44" rx="2" fill="currentColor"/><rect x="0" y="12" width="34" height="6" rx="2" fill="currentColor"/></svg></div>
    <p class="meta">Error 404</p>
    <h1>Page not found</h1>
    <p class="desc">The page you were looking for has moved, been renamed, or never existed.</p>
    <figure class="verse">
      <p>&ldquo;I am the way, the truth, and the life.&rdquo;</p>
      <cite>John 14:6 NKJV</cite>
    </figure>
    <div class="buttons">
      <a href="/" class="button">Back to home</a>
      <a href="/resources/" class="button secondary">Resources</a>
    </div>
    <p class="note">Nothing exists at <span id="missing-path">this address</span>.</p>
  </main>
  <script>
    var missingPath = document.getElementById('missing-path');
    if (missingPath && location.pathname) missingPath.textContent = location.pathname;
  </script>
</body>
</html>
